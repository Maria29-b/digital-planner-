version: "3.8"

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: besap_api
    volumes:
      - ./final_tables:/app/final_tables
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: besap_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
